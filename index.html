body{font-family:var(--font-mono,'Courier New',monospace);}
.tree{padding:16px 12px;font-size:12px;line-height:1.75;color:var(--color-text-primary);}
.row{display:flex;align-items:center;gap:6px;padding:1px 0;cursor:pointer;border-radius:4px;transition:background 0.15s;}
.row:hover{background:var(--color-background-secondary);}
.prefix{color:var(--color-text-tertiary);white-space:pre;font-family:var(--font-mono,'Courier New',monospace);font-size:11px;flex-shrink:0;}
.icon{font-size:13px;flex-shrink:0;}
.name{font-size:12px;font-family:var(--font-mono,'Courier New',monospace);}
.badge{font-size:10px;padding:1px 7px;border-radius:99px;font-weight:500;margin-left:6px;flex-shrink:0;}

.f-root{color:var(--color-text-primary);font-weight:500;}

.f-css{color:#5ec98a;}
.f-config{color:#f0846a;}

.f-env{color:#e86060;}

.legend{display:flex;flex-wrap:wrap;gap:8px;padding:12px 12px 4px;border-bottom:1px solid var(--color-border-tertiary);margin-bottom:8px;}
.leg{display:flex;align-items:center;gap:4px;font-size:11px;}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

.section-hdr{font-size:10px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-text-tertiary);padding:8px 12px 4px;margin-top:4px;}
</style>

const ICONS = {dir:'📁',jsx:'⚛',js:'📄',css:'🎨',config:'⚙',asset:'🖼',env:'🔒'};
const COLORS = {dir:'f-dir',jsx:'f-jsx',js:'f-js',css:'f-css',config:'f-config',asset:'f-asset',env:'f-env'};
const BADGES = {
  'Dashboard.jsx':'hub','Auth.jsx':'auth','supabase.js':'db',
  'AuthContext.jsx':'ctx','AppShell.jsx':'layout','Navbar.jsx':'nav',
  '.env':'secret','og-image.png':'SEO','sitemap.xml':'SEO',
  'robots.txt':'SEO','vercel.json':'deploy','index.html':'SEO+PWA',
  'OpenQuizGame.jsx':'phase 2B','Tutors.jsx':'phase 2A','Oak.jsx':'phase 3',
};
const BADGE_COLORS = {
  'hub':'background:#a78bfa22;color:#a78bfa',
  'auth':'background:#6ab0f522;color:#6ab0f5',
  'db':'background:#5ec98a22;color:#5ec98a',
  'ctx':'background:#e8c97e22;color:#e8c97e',
  'layout':'background:#f0846a22;color:#f0846a',
  'nav':'background:#f0846a22;color:#f0846a',
  'secret':'background:#e8606022;color:#e86060',
  'SEO':'background:#5ec98a22;color:#5ec98a',
  'SEO+PWA':'background:#5ec98a22;color:#5ec98a',
  'deploy':'background:#6ab0f522;color:#6ab0f5',
  'phase 2B':'background:#e8c97e22;color:#e8c97e',
  'phase 2A':'background:#a78bfa22;color:#a78bfa',
  'phase 3':'background:#f0846a22;color:#f0846a',
};

function prefix(level, isLast) {
  if(level===0) return '';
  let p = '';
  for(let i=1;i<level;i++) p += '│  ';
  p += isLast ? '└─ ' : '├─ ';
  return p;
}

const tree = document.getElementById('tree');
DATA.forEach((item,i)=>{
  const next = DATA[i+1];
  const isLast = !next || next.l < item.l;
  const row = document.createElement('div');
  row.className='row';
  const icon = ICONS[item.t]||'📄';
  const colorClass = COLORS[item.t]||'';
  const badge = BADGES[item.n];
  const badgeStyle = badge ? BADGE_COLORS[badge]||'' : '';
  const noteHtml = item.note ? `<span style="color:var(--color-text-tertiary);font-size:11px;margin-left:6px;">// ${item.note}</span>` : '';
  const badgeHtml = badge ? `<span class="badge" style="${badgeStyle}">${badge}</span>` : '';
  row.innerHTML = `
    <span class="prefix">${prefix(item.l, isLast)}</span>
    <span class="icon">${icon}</span>
    <span class="name ${colorClass}">${item.n}</span>
    ${badgeHtml}
    ${noteHtml}
  `;
  tree.appendChild(row);
});
</script>
